# ── Module 2: Legal Authority ──

[[questions]]
id = "m2_q1"
module = 2
question = "Under Section 494 of the Criminal Code, when can a private citizen make an arrest?"
options = ["At any time for any reason", "Only when they find someone committing an indictable offence", "Only with a warrant", "Only during daylight hours"]
correct = 1

[[questions]]
id = "m2_q2"
module = 2
question = "What level of force is a security guard legally permitted to use when making an arrest?"
options = ["Maximum force to ensure compliance", "Reasonable force that is necessary in the circumstances", "No force under any circumstances", "Deadly force if the suspect resists"]
correct = 1

[[questions]]
id = "m2_q3"
module = 2
question = "What is the Trespass to Premises Act used for in security work?"
options = ["To allow guards to search personal belongings", "To authorize the removal of unauthorized persons from private property", "To grant guards the power of arrest for any offence", "To permit surveillance of public areas"]
correct = 1

[[questions]]
id = "m2_q4"
module = 2
question = "Which of the following would constitute unlawful detention by a security guard?"
options = ["Holding a shoplifter until police arrive", "Detaining someone based solely on their appearance", "Asking someone to wait while verifying their ID badge", "Escorting a trespasser to the exit"]
correct = 1

[[questions]]
id = "m2_q5"
module = 2
question = "What must a security guard do immediately after making a citizen's arrest?"
options = ["Transport the person to jail", "Contact their supervisor only", "Turn the arrested person over to a peace officer as soon as possible", "Release the person with a warning"]
