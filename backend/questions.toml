# SecurityPrep Question Bank
# Add questions here in original exam English (Level 3).
# Run seed_questions.py to generate French (L1) and simplified English (L2) variants.
#
# Fields:
#   id       - unique ID, format: m{module}_q{number}
#   module   - module number (1-7)
#   question - the question in original exam English
#   options  - array of 4 answer choices
